# Production one-VPS deployment: worker + scheduler only.
# Vercel and Supabase remain managed external services.
#
# `.env.production` is created only on the server and is never committed.
# It must contain DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# and 9Router gateway configuration (NINEROUTER_BASE_URL, NINEROUTER_API_KEY,
# NINEROUTER_MODEL).
services:
  worker:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    env_file: .env.production
    restart: unless-stopped
  scheduler:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    env_file: .env.production
    command: ["uv", "run", "--no-dev", "python", "-m", "jobmatch_worker.scheduler"]
    restart: unless-stopped
